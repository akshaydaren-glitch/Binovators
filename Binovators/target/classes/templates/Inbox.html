<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Inbox</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
<div class="container">
    <h1 class="page-title">Your Conversations Inbox</h1>

    <p>
        <a href="/animals/page">← Back to All Animals</a> |
        <a href="/adoption/my-applications">Adoption Dashboard</a>
    </p>

    <hr>

    <div th:if="${#lists.isEmpty(messages)}">
        <p>Your inbox is empty.</p>
    </div>

    <div th:each="msg : ${messages}" class="card" style="margin-bottom: 1rem;">
        <p>
            <strong>Regarding Pet:</strong>
            <span th:text="${msg.animal != null ? msg.animal.name : 'Deleted Animal'}"></span><br>

            <span th:if="${msg.sender != null and currentUser != null and msg.sender.id == currentUser.id}">
                <strong>To Owner:</strong>
                <span th:text="${msg.receiver != null ? msg.receiver.name : 'Unknown'}"></span>
            </span>

            <span th:if="${msg.receiver != null and currentUser != null and msg.receiver.id == currentUser.id}">
                <strong>From Inquirer:</strong>
                <span th:text="${msg.sender != null ? msg.sender.name : 'Unknown'}"></span>
            </span><br>

            <strong>Latest Text:</strong>
            <span th:text="${msg.content != null ? msg.content : ''}"></span>
        </p>

        <a th:if="${msg.animal != null and msg.animal.id != null and msg.sender != null and msg.receiver != null and currentUser != null}"
           th:href="@{/messages/thread/{animalId}/{partnerId}(animalId=${msg.animal.id}, partnerId=${msg.sender.id == currentUser.id ? msg.receiver.id : msg.sender.id})}"
           class="primary-btn"
           style="display: inline-flex; padding: 0.7rem 1rem;">
            Open Chat Room →
        </a>
    </div>
</div>
</body>
</html>
