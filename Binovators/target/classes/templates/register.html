<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body style="background: linear-gradient(135deg, #eef2ff 0%, #ecfeff 100%);">
<div class="container">
    <div class="card" style="max-width: 480px; margin: 3rem auto; padding: 2rem; border: 1px solid #bfdbfe; box-shadow: 0 20px 45px rgba(14, 165, 233, 0.16);">
        <h1 class="page-title" style="font-size: 2rem; margin-bottom: 0.5rem; color: #0f766e;">Create Account</h1>
        <p class="page-copy" style="margin-bottom: 1.5rem; color: #6b7280;">Join the community and start sharing pets.</p>

        <form action="/register" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" name="name" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Password" required>
            </div>

            <button class="primary-btn" type="submit" style="width: 100%; margin-top: 0.5rem; background: linear-gradient(135deg, #0f766e, #2563eb); box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);">
                Register
            </button>
        </form>

        <p style="margin-top: 1rem; text-align: center;">
            <a href="/login">Already have an account?</a>
        </p>
    </div>
</div>
</body>
</html>
