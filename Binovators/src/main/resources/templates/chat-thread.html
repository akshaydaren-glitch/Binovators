<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Chat Room</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 30px;">

    <h1>Chat with <span th:text="${partner.name}"></span></h1>
    <h3>Subject Profile: <span th:text="${animal.name}"></span></h3>
    <p><a href="/messages/inbox">← Back to Inbox</a></p>
    <hr>

    <!-- CHAT VIEWPORT CONTAINER -->
    <div id="chatBox" style="border: 1px solid #aaa; height: 300px; overflow-y: scroll; padding: 15px; background: #f9f9f9; margin-bottom: 20px;">
        <div th:each="chat : ${chatHistory}" style="margin-bottom: 10px;">
            <div th:style="${chat.sender.id == currentUser.id} ? 'text-align: right;' : 'text-align: left;'">
                <div th:style="${chat.sender.id == currentUser.id} ? 'display: inline-block; background: #e1ffc7; padding: 8px; border-radius: 5px;' : 'display: inline-block; background: #fff; padding: 8px; border-radius: 5px; border: 1px solid #eee;'">
                    <small style="color: #555; display: block; font-weight: bold;" th:text="${chat.sender.name}"></small>
                    <span th:text="${chat.content}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- FORM CONTROLS -->
    <form action="/messages/send" method="post">
        <input type="hidden" name="animalId" th:value="${animal.id}">
        <input type="hidden" name="receiverId" th:value="${partner.id}">
        <input type="text" name="content" style="width: 75%; padding: 10px;" placeholder="Write a message..." required autofocus>
        <button type="submit" style="padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer;">Send</button>
    </form>

    <!-- LIVE CONVERSATION AUTO-REFRESH SCRIPT -->
    <script th:inline="javascript">
        const animalId = /*[[${animal.id}]]*/ 0;
        const partnerId = /*[[${partner.id}]]*/ 0;
        const chatBox = document.getElementById('chatBox');

        const isNearBottom = () => {
            return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 50;
        };

        const updateChat = (newHtml) => {
            const wasAtBottom = isNearBottom();
            const previousScrollTop = chatBox.scrollTop;
            const previousScrollHeight = chatBox.scrollHeight;

            chatBox.innerHTML = newHtml;

            if (wasAtBottom) {
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                const heightDiff = chatBox.scrollHeight - previousScrollHeight;
                chatBox.scrollTop = Math.max(0, previousScrollTop + heightDiff);
            }
        };

        setInterval(() => {
            fetch(`/messages/thread/${animalId}/${partnerId}`)
                .then(res => res.text())
                .then(html => {
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const freshChat = doc.getElementById('chatBox');
                    if (freshChat && chatBox) {
                        updateChat(freshChat.innerHTML);
                    }
                }).catch(err => console.error("Polling error:", err));
        }, 3000);
    </script>

</body>
</html>
