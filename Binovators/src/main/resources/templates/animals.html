<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animals</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>

<body>
<div class="container">
    <section class="hero" style="padding: 1.5rem 0 2rem;">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
            <div>
                <h1 class="page-title">Animals Page</h1>
                <p class="page-copy" style="margin-top: 0.5rem;">Manage pets, review applications, and connect with owners in one place.</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 0.75rem;">
                <a class="primary-btn" href="/animals/my">My Animals</a>
                <a class="primary-btn" href="/messages/inbox">Inbox</a>
            </div>
        </div>
    </section>

    <section class="section" style="padding-top: 0;">
        <div class="card" style="margin-bottom: 1.5rem;">
            <h2 class="card-title">Add a New Animal</h2>
            <form action="/animals" method="post" enctype="multipart/form-data">
                <div class="grid-2">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="type" placeholder="Type" required>
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" name="description" placeholder="Description" required>
                </div>
                <div class="form-group">
                    <input type="text" name="status" placeholder="Status" required>
                </div>
                <div class="form-group">
                    <input type="file" name="image" accept="image/*">
                </div>
                <button class="primary-btn" type="submit">Save Animal</button>
            </form>
        </div>
    </section>

    <section class="section" style="padding-top: 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem;">
            <h2 class="card-title" style="margin: 0;">Available Animals</h2>
        </div>

        <div th:if="${#lists.isEmpty(animals)}">
            <p>No animals found.</p>
        </div>

        <div th:each="animal : ${animals}" th:if="${animal != null}" class="card" style="margin-bottom: 1.25rem;">
            <div class="grid-2" style="gap: 1.5rem; align-items: start;">
                <div>
                    <p style="margin-top: 0;">
                        <strong>Name:</strong> <span th:text="${animal.name}"></span><br>
                        <strong>Type:</strong> <span th:text="${animal.type}"></span><br>
                        <strong>Description:</strong> <span th:text="${animal.description}"></span><br>
                        <strong>Status:</strong> <span th:text="${animal.status}"></span><br>
                        <strong>Posted by:</strong>
                        <span th:text="${animal.user != null ? animal.user.username : 'Unknown'}"></span>
                    </p>

                    <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0;">
                        <a class="primary-btn" th:href="@{'/animals/edit/' + ${animal.id}}">Edit</a>
                        <a class="primary-btn" th:href="@{'/animals/delete/' + ${animal.id}}">Delete</a>
                    </div>
                </div>

                <div>
                    <img th:src="@{'/animals/image/' + ${animal.id}}" style="width: 100%; max-width: 320px; margin-bottom: 1rem; border-radius: 12px;">

                    <div style="margin-bottom: 1rem;">
                        <button class="primary-btn collapse-button" type="button" style="margin-bottom: 0.5rem;" th:attr="data-target=${'adopt-' + animal.id}" aria-expanded="false">Adopt This Pet</button>
                        <div th:id="${'adopt-' + animal.id}" class="collapse-content" style="display:none;">
                            <form th:action="@{/adoption/apply/{id}(id=${animal.id})}" method="post">
                                <input type="text" name="notes" placeholder="Why do you want to adopt?">
                                <button class="primary-btn" type="submit" style="margin-top: 0.5rem;">Submit Adoption Request</button>
                            </form>
                        </div>
                    </div>

                    <div>
                        <button class="primary-btn collapse-button" type="button" style="margin-bottom: 0.5rem;" th:attr="data-target=${'message-' + animal.id}" aria-expanded="false">Message Owner</button>
                        <div th:id="${'message-' + animal.id}" class="collapse-content" style="display:none;">
                            <form th:action="@{/messages/send}" method="post">
                                <input type="hidden" name="animalId" th:value="${animal.id}">
                                <input type="hidden" name="receiverId" th:value="${animal.user.id}">
                                <textarea name="content" placeholder="Ask the owner questions"></textarea>
                                <button class="primary-btn" type="submit" style="margin-top: 0.5rem;">Send Message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>

</html>
