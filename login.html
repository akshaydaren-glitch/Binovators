<!DOCTYPE html>
<html lang="nl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Binovator</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body class="login-page">
    <div class="Binovators">
        <nav>
            <div class="nav-left">
                <a href="Index.html" class="logo-section"><img src="Images/logo.png" class="home-thumb" width="100" height="70" alt="Logo"><img src="Images/naam.png" class="home-name" width="90" height="40" alt="Name"></a>
            </div>
            <ul class="nav-center">
                <li><a href="Index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="findapet.html">Find a Pet</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-right">
                <a href="login.html" class="btn active">Log in</a>
                <a href="findapet.html" class="btn anim">Get Started</a>
            </div>
        </nav>

        <div class="login-card">
            <form>
                <h2>Login</h2>
                <div class="input-group">
                    <label for="username">Username:</label>
                    <input type="text" placeholder="Username" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" placeholder="Password" id="password" name="password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Log in</button>
                    <a href="signup.html" class="btn secondary-btn">Sign up</a>
                </div>
            </form>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
